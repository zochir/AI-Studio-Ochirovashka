name: Android emulator smoke test (bounded)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - 'scripts/**'
      - '.github/workflows/android-emulator-smoke-v2.yml'
      - '.github/workflows/build-apk-from-zip.yml'
permissions:
  contents: read
concurrency:
  group: android-emulator-smoke-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Locate Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo 'No project ZIP found at repository root'; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || { echo 'Gradle settings file missing'; exit 1; }
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts" || { echo 'Android app Gradle file missing'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Apply Comic Studio patch
        run: python3 scripts/patch-comic-studio.py "$PROJECT_DIR"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK and emulator packages
        timeout-minutes: 5
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace -I "$GITHUB_WORKSPACE/scripts/ci-jvm-targets.gradle" -Pkotlin.jvm.target.validation.mode=warning assembleDebug
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/app-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Ochirovashka-APK-smoke-v2
          path: apk-output/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run bounded emulator smoke test
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          AVD_NAME=ochiro-ci-api30
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$AVDMANAGER" || { echo "avdmanager not found: $AVDMANAGER"; exit 1; }
          printf 'no\n' | "$AVDMANAGER" create avd --force -n "$AVD_NAME" -k "system-images;android-30;google_apis;x86_64" -d "pixel_2" > "$GITHUB_WORKSPACE/avdmanager-create.log" 2>&1
          cat "$GITHUB_WORKSPACE/avdmanager-create.log"
          "$AVDMANAGER" list avd > "$GITHUB_WORKSPACE/avdmanager-list.log" 2>&1
          cat "$GITHUB_WORKSPACE/avdmanager-list.log"
          test -s "$ANDROID_AVD_HOME/$AVD_NAME.ini" || { echo "AVD ini was not created in $ANDROID_AVD_HOME"; find "$HOME/.android" -maxdepth 4 -type f -print || true; exit 1; }
          adb start-server
          EMULATOR_BIN="$ANDROID_HOME/emulator/emulator"
          test -x "$EMULATOR_BIN" || { echo "Emulator binary not found: $EMULATOR_BIN"; find "$ANDROID_HOME" -maxdepth 3 -type f -name emulator -print; exit 1; }
          "$EMULATOR_BIN" -accel-check > "$GITHUB_WORKSPACE/emulator-accel-check.log" 2>&1 || true
          "$EMULATOR_BIN" -avd "$AVD_NAME" -port 5554 -no-window -no-audio -no-boot-anim -wipe-data -no-snapshot -no-snapshot-save -no-snapshot-load -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 -camera-back none -verbose > "$GITHUB_WORKSPACE/emulator-console.log" 2>&1 &
          EMULATOR_PID=$!
          BOOTED=0
          for i in $(seq 1 360); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before Android finished booting"
              break
            fi
            STATE="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$STATE" = "1" ]; then BOOTED=1; break; fi
            sleep 1
          done
          if [ "$BOOTED" != "1" ]; then
            echo "Android emulator failed to boot within 360 seconds"
            adb devices -l > "$GITHUB_WORKSPACE/emulator-devices.txt" 2>&1 || true
            ps auxww > "$GITHUB_WORKSPACE/emulator-processes.txt" 2>&1 || true
            df -h > "$GITHUB_WORKSPACE/emulator-disk-space.txt" 2>&1 || true
            timeout 8s adb -s emulator-5554 logcat -b all -d -t 1200 > "$GITHUB_WORKSPACE/emulator-boot-failure.log" 2>&1 || true
            tail -n 300 "$GITHUB_WORKSPACE/emulator-console.log" || true
            exit 1
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          APK="$GITHUB_WORKSPACE/apk-output/app-debug.apk"
          adb -s emulator-5554 install -r "$APK"
          PACKAGE="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          ACTIVITY="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n "s/^launchable-activity: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test -n "$PACKAGE" || { echo "Could not determine APK package name"; exit 1; }
          test -n "$ACTIVITY" || { echo "Could not determine APK launch activity"; exit 1; }
          adb -s emulator-5554 shell am force-stop "$PACKAGE" || true
          adb -s emulator-5554 shell am start -W -n "$PACKAGE/$ACTIVITY"
          sleep 5
          adb -s emulator-5554 shell dumpsys activity activities > "$GITHUB_WORKSPACE/emulator-activities.txt"
          grep -F "$PACKAGE" "$GITHUB_WORKSPACE/emulator-activities.txt"
          adb -s emulator-5554 logcat -b all -d -t 2000 > "$GITHUB_WORKSPACE/emulator-logcat.txt"
          ! grep -E 'FATAL EXCEPTION|Fatal signal|Process: .* has died' "$GITHUB_WORKSPACE/emulator-logcat.txt"
          echo "SMOKE TEST PASSED: APK installed and launcher activity started without a fatal crash"
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Ochirovashka-Emulator-Diagnostics-v2
          path: |
            avdmanager-create.log
            avdmanager-list.log
            emulator-console.log
            emulator-accel-check.log
            emulator-processes.txt
            emulator-disk-space.txt
            emulator-devices.txt
            emulator-boot-failure.log
            emulator-logcat.txt
            emulator-activities.txt
          if-no-files-found: warn
          retention-days: 14
