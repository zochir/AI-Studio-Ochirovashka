name: Build AI Studio Ochirovashka APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "Project ZIP not found in repository root"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""
          while IFS= read -r -d '' file; do
            PROJECT_DIR="$(dirname "$file")"
            break
          done < <(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Neither settings.gradle nor settings.gradle.kts was found in ZIP"
            echo "Files extracted from ZIP:"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/build.gradle" && ! -f "$PROJECT_DIR/build.gradle.kts" ]]; then
            echo "Root build.gradle or build.gradle.kts not found in: $PROJECT_DIR"
            exit 1
          fi
          if [[ ! -d "$PROJECT_DIR/app" ]]; then
            echo "Android app module directory not found: $PROJECT_DIR/app"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Building project from: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Ochirovashka-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
