name: Build MNN Diffusion Android runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mnn-diffusion-runtime.yml'

permissions:
  contents: read

concurrency:
  group: mnn-diffusion-runtime
  cancel-in-progress: false

jobs:
  build-arm64-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout MNN source
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: 3.6.1
          path: mnn-src
          fetch-depth: 1

      - name: Install CMake and NDK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Configure MNN with diffusion enabled
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          cmake -S mnn-src -B mnn-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DMNN_BUILD_DIFFUSION=ON \
            -DMNN_BUILD_LLM=ON \
            -DMNN_OPENCL=ON \
            -DMNN_SUPPORT_TRANSFORMER_FUSE=ON \
            -DMNN_IMGCODECS=ON \
            -DMNN_BUILD_TEST=OFF \
            -DMNN_BUILD_BENCHMARK=OFF \
            -DMNN_BUILD_OPENCV=ON \
            -DMNN_BUILD_LLM_OMNI=OFF \
            -DMNN_SEP_BUILD=OFF \
            -DMNN_BUILD_FOR_ANDROID_COMMAND=ON \
            -DMNN_LOW_MEMORY=ON \
            -DMNN_USE_LOGCAT=OFF

      - name: Build native MNN runtime
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          cmake --build mnn-build --target MNN --parallel 2
          mapfile -t libs < <(find mnn-build -type f -name 'libMNN.so' -print)
          test "${#libs[@]}" -gt 0 || { echo "libMNN.so not produced"; exit 1; }
          mkdir -p runtime-artifact/arm64-v8a
          cp "${libs[0]}" runtime-artifact/arm64-v8a/libMNN.so
          file runtime-artifact/arm64-v8a/libMNN.so
          nm -D -C runtime-artifact/arm64-v8a/libMNN.so | grep -E 'Diffusion::createDiffusion' | head -10
          sha256sum runtime-artifact/arm64-v8a/libMNN.so > runtime-artifact/SHA256SUMS.txt
          {
            echo "MNN source ref: 3.6.1"
            echo "ABI: arm64-v8a"
            echo "Diffusion enabled: true"
            echo "LLM/tokenizer support enabled: true"
            echo "Android minimum API: 26"
            echo "Build: Release"
          } > runtime-artifact/BUILD-INFO.txt

      - name: Upload verified native runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: MNN-Diffusion-Android-arm64-candidate
          path: runtime-artifact/*
          if-no-files-found: error
          retention-days: 14
