name: Mobile APK build (no emulator dependency)

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "scripts/**"
      - "android-overlay/**"
      - ".github/workflows/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate autonomous runner shell syntax
        run: bash -n scripts/autonomous-agent-loop.sh

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP_FILE" || { echo "No Android project ZIP found"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || { echo "Gradle settings file not found"; exit 1; }
          test -d "$PROJECT_DIR/app" || { echo "Android app module not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Apply tracked Android source overlay
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d android-overlay ]]; then cp -a android-overlay/. "$PROJECT_DIR"/; echo "Applied tracked Android source overlay."; else echo "No Android source overlay files to apply."; fi

      - name: Inventory Android native integration points
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Android manifests ---"
          while IFS= read -r manifest; do
            echo "### $manifest"
            sed -n '1,180p' "$manifest"
          done < <(find "$PROJECT_DIR/app/src/main" -type f -name AndroidManifest.xml)
          echo "--- Gradle SDK, NDK, ABI and native build declarations ---"
          grep -RInE 'namespace|applicationId|minSdk|targetSdk|compileSdk|ndkVersion|abiFilters|externalNativeBuild|cmake' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' --include='gradle.properties' --exclude-dir=.gradle || true
          echo "--- Existing Java/Kotlin/C++ source paths ---"
          find "$PROJECT_DIR/app/src/main" -type f | grep -E '\.(kt|java|cpp|c|h|hpp|so)$' | sort || true
          echo "--- Existing JNI and native library references ---"
          grep -RInE 'System.loadLibrary|external fun|JNIEXPORT|lib[A-Za-z0-9_]+\.so' "$PROJECT_DIR/app/src/main" --include='*.kt' --include='*.java' --include='*.cpp' --include='*.h' --include='*.xml' || true

      - name: Inspect Android host source and build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Android source tree ---"
          find "$PROJECT_DIR/app/src" -type f | sort
          echo "--- MainActivity.kt ---"
          sed -n '1,260p' "$PROJECT_DIR/app/src/main/java/com/ainewsstudio/app/MainActivity.kt"
          echo "--- App Gradle configuration ---"
          sed -n '1,240p' "$PROJECT_DIR/app/build.gradle.kts"
          echo "--- Root Gradle configuration files ---"
          for config in "$PROJECT_DIR/build.gradle.kts" "$PROJECT_DIR/settings.gradle.kts" "$PROJECT_DIR/gradle.properties"; do
            if [[ -f "$config" ]]; then echo "### $config"; sed -n '1,200p' "$config"; fi
          done

      - name: Patch Comic Studio module
        run: python3 scripts/patch-comic-studio.py "$PROJECT_DIR"
        
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/assets/index.html" <<'PY'
          import html.parser, pathlib, subprocess, sys, tempfile
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          class Parser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.external=False; self.parts=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script":
                      self.active=True; self.external=any(k.lower()=="src" for k,_ in attrs); self.parts=[]
              def handle_data(self, data):
                  if self.active and not self.external: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.active:
                      if not self.external and "".join(self.parts).strip(): self.scripts.append("".join(self.parts))
                      self.active=False
          p=Parser(); p.feed(source)
          if not p.scripts: raise SystemExit("No inline JavaScript found")
          with tempfile.TemporaryDirectory() as d:
              for i, script in enumerate(p.scripts):
                  file=pathlib.Path(d)/f"inline-{i}.js"; file.write_text(script,encoding="utf-8")
                  subprocess.run(["node","--check",str(file)],check=True)
          print(f"PASS: syntax checked {len(p.scripts)} inline JavaScript block(s)")
          PY

      - name: Test Android editor interactions
        run: node scripts/test-webapp.cjs "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Test Comic Studio flows with mocked APIs
        run: node scripts/test-comic-studio.cjs "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android platform packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch verified MNN Diffusion runtime artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mnn-diffusion-runtime.yml/runs?status=success&per_page=5"
          run_id="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" | jq -r '.workflow_runs[0].id // empty')"
          test -n "$run_id" || { echo "No successful MNN Diffusion runtime build found"; exit 1; }
          artifacts_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts"
          artifact_id="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$artifacts_api" | jq -r '.artifacts[] | select(.name=="MNN-Diffusion-Android-arm64-candidate" and .expired==false) | .id' | head -1)"
          test -n "$artifact_id" || { echo "Successful runtime run $run_id has no unexpired runtime artifact"; exit 1; }
          curl --fail --location --retry 3 --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id/zip" -o /tmp/mnn-runtime.zip
          mkdir -p /tmp/mnn-runtime
          unzip -q /tmp/mnn-runtime.zip -d /tmp/mnn-runtime
          test -s /tmp/mnn-runtime/arm64-v8a/libMNN.so
          sed 's#runtime-artifact/##' /tmp/mnn-runtime/SHA256SUMS.txt | (cd /tmp/mnn-runtime && sha256sum -c -)
          echo "MNN_RUNTIME_SOURCE_RUN=$run_id" >> "$GITHUB_ENV"
          echo "MNN_RUNTIME_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "Verified runtime artifact $artifact_id from run $run_id"

      - name: Checkout MNN headers for JNI compilation
        uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: 3.6.1
          path: mnn-source
          fetch-depth: 1

      - name: Export compatible Stable Diffusion tokenizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/mnn-tokenizer-venv
          /tmp/mnn-tokenizer-venv/bin/pip install --disable-pip-version-check "transformers==4.46.3" sentencepiece
          mkdir -p /tmp/sd15-tokenizer-source /tmp/sd15-tokenizer-output
          for file in config.json tokenizer.json tokenizer_config.json special_tokens_map.json vocab.json merges.txt; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://huggingface.co/openai/clip-vit-large-patch14/resolve/main/$file" \
              -o "/tmp/sd15-tokenizer-source/$file"
          done
          PYTHONPATH="$GITHUB_WORKSPACE/mnn-source/transformers/diffusion/export" \
            /tmp/mnn-tokenizer-venv/bin/python - <<'PY'
          from convert_mnn import export_diffusion_mtok
          export_diffusion_mtok("/tmp/sd15-tokenizer-source", "/tmp/sd15-tokenizer-output")
          PY
          test -s /tmp/sd15-tokenizer-output/tokenizer.mtok || { echo "MNN tokenizer export did not produce tokenizer.mtok"; exit 1; }
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp /tmp/sd15-tokenizer-output/tokenizer.mtok "$PROJECT_DIR/app/src/main/assets/tokenizer.mtok"
          sha256sum "$PROJECT_DIR/app/src/main/assets/tokenizer.mtok" | awk '{print $1}' > "$PROJECT_DIR/app/src/main/assets/tokenizer.sha256"
          cat "$PROJECT_DIR/app/src/main/assets/tokenizer.sha256"
          echo "Exported official CLIP tokenizer to MNN .mtok format and wrote its SHA-256 manifest."

      - name: Validate pinned SD1.5 model manifest without downloading weights
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/sd15-manifest.json
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/api/models/taobao-mnn/stable-diffusion-v1-5-mnn-opencl/tree/0dc4a5dbcee59a83bbc9694d13b10b4a7de4adc2?recursive=true&expand=true" \
            -o "$manifest"
          total=0
          for file in alphas.txt text_encoder.mnn text_encoder.mnn.weight unet.mnn unet.mnn.weight vae_decoder.mnn vae_decoder.mnn.weight; do
            item="$(jq -c --arg file "$file" '[.[] | select(.path==$file)][0] // empty' "$manifest")"
            test -n "$item" || { echo "Pinned model manifest is missing $file"; exit 1; }
            oid="$(jq -r 'if .lfs.oid then .lfs.oid else .oid end' <<<"$item")"
            size="$(jq -r 'if .lfs.size then .lfs.size else .size end' <<<"$item")"
            test -n "$oid" && test "$oid" != "null" && test "$size" -gt 0
            total=$((total + size))
            echo "$file: $size bytes; integrity identifier present"
          done
          test "$total" -gt 1000000000 || { echo "Model size is unexpectedly small: $total"; exit 1; }
          # Exercise both integrity paths against small files only; never fetch the large weights in CI.
          echo "Diagnostic text_encoder.mnn metadata:"
          jq -c '.[] | select(.path=="text_encoder.mnn") | {oid,lfs,xetHash,xet_hash,size}' "$manifest"
          for file in alphas.txt text_encoder.mnn; do
            item="$(jq -c --arg file "$file" '[.[] | select(.path==$file)][0] // empty' "$manifest")"
            expected_oid="$(jq -r 'if .lfs.oid then .lfs.oid else .oid end' <<<"$item")"
            expected_size="$(jq -r 'if .lfs.size then .lfs.size else .size end' <<<"$item")"
            sample="/tmp/sd15-sample-$file"
            curl --fail --location --retry 3 --silent --show-error \
              "https://huggingface.co/taobao-mnn/stable-diffusion-v1-5-mnn-opencl/resolve/0dc4a5dbcee59a83bbc9694d13b10b4a7de4adc2/$file?download=true" \
              -o "$sample"
            actual_size="$(wc -c < "$sample" | tr -d ' ')"
            test "$actual_size" -eq "$expected_size"
            if [[ ${#expected_oid} -eq 64 ]]; then
              actual_oid="$(sha256sum "$sample" | awk '{print $1}')"
              expected_oid="${expected_oid#sha256:}"
            else
              actual_oid="$({ printf 'blob %s\0' "$expected_size"; cat "$sample"; } | sha1sum | awk '{print $1}')"
            fi
            test "$actual_oid" = "$expected_oid" || { echo "Integrity verification failed for $file"; exit 1; }
            echo "Downloaded and verified small manifest sample: $file ($actual_size bytes)"
          done
          echo "Pinned model manifest and both Git/LFS integrity paths validated. Large weights were not downloaded in CI."

      - name: Compile Android JNI bridge and package MNN runtime
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          if [[ ! -d "$ANDROID_NDK_HOME" ]]; then
            sdkmanager --install "ndk;27.2.12479018"
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a"
          cp /tmp/mnn-runtime/arm64-v8a/libMNN.so "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libMNN.so"
          cmake -S "$PROJECT_DIR/app/src/main/cpp" -B /tmp/comicdiffusion-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DMNN_ROOT="$GITHUB_WORKSPACE/mnn-source" \
            -DMNN_RUNTIME_LIB="$GITHUB_WORKSPACE/$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/libMNN.so"
          cmake --build /tmp/comicdiffusion-build --parallel 2
          test -s /tmp/comicdiffusion-build/libcomicdiffusion.so
          cp /tmp/comicdiffusion-build/libcomicdiffusion.so "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/"
          file "$PROJECT_DIR/app/src/main/jniLibs/arm64-v8a/"*.so
          echo "MNN runtime run: $MNN_RUNTIME_SOURCE_RUN; artifact: $MNN_RUNTIME_ARTIFACT_ID"


      - name: Probe official MNN Android runtime for diffusion symbols
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/alibaba/MNN/releases/download/3.6.1/mnn_3.6.1_android_armv7_armv8_cpu_opencl_vulkan.zip"
          curl --fail --location --retry 3 --silent --show-error "$url" -o /tmp/mnn-android-runtime.zip
          echo "Downloaded official MNN Android runtime; archive SHA-256:"
          sha256sum /tmp/mnn-android-runtime.zip
          unzip -l /tmp/mnn-android-runtime.zip | sed -n '1,100p'
          mkdir -p /tmp/mnn-runtime-probe
          unzip -q /tmp/mnn-android-runtime.zip -d /tmp/mnn-runtime-probe
          mapfile -t libs < <(find /tmp/mnn-runtime-probe -type f -name 'libMNN.so' | head -20)
          if [[ ${#libs[@]} -eq 0 ]]; then
            echo "::warning::Official archive contains no libMNN.so at expected paths; local diffusion integration remains blocked."
            exit 0
          fi
          for lib in "${libs[@]}"; do
            echo "--- Inspecting ${lib} ---"
            file "$lib"
            if nm -D -C "$lib" 2>/dev/null | grep -E 'MNN::DIFFUSION::Diffusion::createDiffusion|Diffusion::createDiffusion' | head -5; then
              echo "MNN_DIFFUSION_SYMBOLS_FOUND=true" >> "$GITHUB_ENV"
            else
              echo "No exported Diffusion::createDiffusion symbol in this binary."
            fi
          done
          if [[ "${MNN_DIFFUSION_SYMBOLS_FOUND:-false}" != "true" ]]; then
            echo "::warning::Prebuilt Android runtime does not expose the required diffusion entry point; do not link it as a local image generator."
          fi

      - name: Build debug APK
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace -I "$GITHUB_WORKSPACE/scripts/ci-jvm-targets.gradle" -Pkotlin.jvm.target.validation.mode=warning assembleDebug
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$APK" || { echo "Debug APK missing or empty"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/AI-Studio-Ochirovashka-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/apk-output/AI-Studio-Ochirovashka-debug.apk" >/dev/null
          APK="$GITHUB_WORKSPACE/apk-output/AI-Studio-Ochirovashka-debug.apk"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/tokenizer.mtok"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libMNN.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libcomicdiffusion.so"
          echo "Verified APK contains Comic Studio UI, tokenizer, MNN runtime, and JNI diffusion bridge."
          (cd "$GITHUB_WORKSPACE/apk-output" && sha256sum AI-Studio-Ochirovashka-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Ochirovashka-APK
          path: apk-output/*
          if-no-files-found: error
          retention-days: 30
