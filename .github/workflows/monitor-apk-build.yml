name: Monitor Android APK build

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  detect-stalled-build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Detect a stalled APK build and report once
        uses: actions/github-script@v7
        with:
          script: |
            const workflowPath = ".github/workflows/build-apk-from-zip.yml";
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowPath,
              per_page: 10
            });
            const run = runs.data.workflow_runs[0];
            if (!run) {
              core.info("No APK build runs found yet.");
              return;
            }
            const ageMinutes = (Date.now() - Date.parse(run.updated_at)) / 60000;
            core.info(`Latest APK run #${run.run_number}: ${run.status}/${run.conclusion}; last updated ${ageMinutes.toFixed(1)} minutes ago.`);
            if (run.status !== "in_progress" || ageMinutes < 45) {
              core.info("No stalled in-progress build detected.");
              return;
            }
            const title = `[CI] APK build #${run.run_number} appears stalled`;
            const openIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            if (openIssues.data.some(issue => !issue.pull_request && issue.title === title)) {
              core.info("A matching open issue already exists; avoiding duplicates.");
              return;
            }
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });
            const jobSummary = jobs.data.jobs.map(job =>
              `- **${job.name}**: ${job.status}${job.conclusion ? ` (${job.conclusion})` : ""}` +
              (job.steps || []).filter(step => step.status === "in_progress")
                .map(step => `\\n  - Running step: ${step.name}`).join("")
            ).join("\\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "The scheduled monitor detected an APK workflow run that has remained in progress without an update for at least 45 minutes.",
                "",
                `- Run: ${run.html_url}`,
                `- Commit: ${run.head_sha}`,
                `- Last updated: ${run.updated_at}`,
                `- Observed age: ${ageMinutes.toFixed(1)} minutes`,
                "",
                "### Job status",
                jobSummary || "No job details returned.",
                "",
                "This alert does not automatically restart the build, to avoid endless retry loops. Inspect the run and retry only after identifying a safe recovery."
              ].join("\\n")
            });
            core.warning(`Created issue for stalled APK build #${run.run_number}.`);
