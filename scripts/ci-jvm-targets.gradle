// CI-only JVM target alignment for the bundled Android project.
gradle.projectsEvaluated {
    rootProject.allprojects.each { project ->
        project.tasks.each { task ->
            if (task instanceof org.gradle.api.tasks.compile.JavaCompile) {
                task.sourceCompatibility = '17'
                task.targetCompatibility = '17'
            }
            if (task.class.name.contains('KotlinCompile')) {
                try {
                    task.kotlinOptions.jvmTarget = '17'
                } catch (Throwable ignored) {
                    // Kotlin plugin API varies by version; validation mode below
                    // provides a safe fallback for modern compilerOptions-only tasks.
                }
            }
        }
    }
}
